# EyeComfort Shader 1.0 - Iris post-processing pack
# Explicit geometry programs avoid generated fallback shaders across Iris versions.
# Do not add gbuffers_line: Iris forces that specific program through the core
# path. Lines intentionally inherit our gbuffers_basic compatibility program.
oldLighting = true
screen = <profile> FILTER_STRENGTH TEMPERATURE CONTRAST BLACK_LEVEL WHITE_LEVEL HIGHLIGHTS SATURATION
screen.columns = 2
sliders = FILTER_STRENGTH TEMPERATURE CONTRAST BLACK_LEVEL WHITE_LEVEL HIGHLIGHTS SATURATION

profile.NEUTRO = FILTER_STRENGTH:1.00 TEMPERATURE:6500 CONTRAST:1.00 BLACK_LEVEL:0.000 WHITE_LEVEL:1.00 HIGHLIGHTS:0.00 SATURATION:1.00
profile.SUAVE = FILTER_STRENGTH:1.00 TEMPERATURE:5500 CONTRAST:0.95 BLACK_LEVEL:0.010 WHITE_LEVEL:0.95 HIGHLIGHTS:0.10 SATURATION:0.95
profile.DESCANSO = FILTER_STRENGTH:1.00 TEMPERATURE:4500 CONTRAST:0.90 BLACK_LEVEL:0.025 WHITE_LEVEL:0.90 HIGHLIGHTS:0.20 SATURATION:0.85
profile.NOCHE = FILTER_STRENGTH:1.00 TEMPERATURE:3500 CONTRAST:0.80 BLACK_LEVEL:0.040 WHITE_LEVEL:0.80 HIGHLIGHTS:0.40 SATURATION:0.75
